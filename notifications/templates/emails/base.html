<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#FBF7F0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1F2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF7F0;">
    <tr><td align="center" style="padding:24px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr><td style="font-size:20px;font-weight:700;padding-bottom:16px;">👟 {{ SITE_NAME }}</td></tr>
        <tr><td style="background:#ffffff;border-radius:20px;padding:28px 24px;font-size:18px;line-height:1.55;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 4px;font-size:14px;line-height:1.5;color:#52606D;">
          {% block footer %}{% endblock %}
          <p style="margin:8px 0 0;">Not medical advice. Stop if something hurts.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
